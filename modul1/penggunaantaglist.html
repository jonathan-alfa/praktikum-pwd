<!DOCTYPE html>
<html>
<head>
    <title>Penggunaan tag list</title>
</head>
<body>
    <h1>Daftar Hardware</h1>
    <ol>
        <li>PSU</li>
        <li>RAM</li>
        <li>CD-ROM</li>
        <li>Procesor</li>
        <li>VGA</li>
    </ol>

    <!-- latihan kedua -->
    <ul>
        <li>PSU</li>
        <li>RAM</li>
        <li>CD-ROM</li>
        <li>Procesor</li>
        <li>VGA</li>
    </ul>

    <!-- penggunaan kodelist apa aja -->
    <ol start="5"></ol>
    <ol type="A"></ol>
    <ol type="a"></ol>
    <ol type="I"></ol>
    <ol type="i"></ol>
    <!-- kode list angka romawi mulai dari 7 -->
    <ol type="A" start="7">
        <li>PSU</li>
        <li>RAM</li>
        <li>CD-ROM</li>
        <li>Procesor</li>
        <li>VGA</li>
    </ol>
</body>
</html>
