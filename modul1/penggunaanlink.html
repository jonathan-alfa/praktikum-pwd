<!DOCTYPE html>
<html>
<head>
    <title>Penggunaan tag link</title>
</head>
<body>
    <h1>Belajar tag link</h1>
    <p>Saya sedang belajar HTML di <a href="http://www.unipma.ac.id">Universitas PGRI Madiun</a></p>

    <!-- penggunaan tag link untuk alamat relatif -->
    <h1>Belajar Tag link relatif</h1>
    <p>Mau akses latihan praktikum ku, <a href="latihanpraktikum2.html">disini aja</a></p>

    <!-- atribut tag :target -->
    <h1>Belajar tag link target</h1>
    <p>saya adalah mahasiswa di <a href="http://www.unipma.ac.id" target="_blank">Universitas PGRI Madiun</a></p>
</body>
</html>
